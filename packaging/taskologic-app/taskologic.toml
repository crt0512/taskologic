# Taskologic "client" app

[app]
name = "Taskologic"
id = "net.512mb.taskologic_app"
binary = "taskologic-app"
version = "1.0.4"
description = "Taskologic, the terminal kanban board"
icon = "logo.png"

[ssh]
# server = "tasks.example.com"
command = "taskologic"
shell_toggle = { label = "Taskologic Shell", default = true }
on_exit = "close"
logout_keeps_setup = true
credentials = "unsafe"
unsafe_warning = false

[login]
logo_file = "logo.txt"
logo_color = "#ff1900"
title = """Tasko-Logic"""

[packaging]
homepage = "https://github.com/crt0512/taskologic"
long_description = "Opens Taskologic in its own window: logs you into your Taskologic server over SSH, reconnects by itself when the connection drops. Includes a kiosk mode with an on screen keyboard for touchscreens."
maintainer = "crt <crt@512mb.net>"
# license = ""

# Fuck you android for not allowing numbers after the dot in the package name.
android_package = "net.fivetwelvemb.taskologic_app"