[workspace]
resolver = "3"
members = [
    "crates/taskologic-core",
    "crates/taskologic-proto",
    "crates/taskologic-print",
    "crates/taskologicd",
    "crates/taskologic",
]

[workspace.package]
version = "0.1.10"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
taskologic-core = { path = "crates/taskologic-core" }
taskologic-proto = { path = "crates/taskologic-proto" }
taskologic-print = { path = "crates/taskologic-print" }

ratatui = "=0.30.2"
crossterm = { version = "=0.29.0", features = ["event-stream"] }
rat-widget = "=3.2.1"
rat-focus = "=2.1.1"
rat-event = "=2.1.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs", "process"] }
# rusqlite_migration 2.6 wants Rust 1.95, too lazy to upgrade
rusqlite = { version = "=0.39.0", features = ["bundled", "chrono"] }
rusqlite_migration = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
anyhow = "=1.0.104"
barcoders = { version = "=2.0.0", default-features = false }
qrcode = { version = "=0.14.1", default-features = false }
datamatrix = "=0.3.3"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "=0.10.4", features = ["serde"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
toml = "=1.1.5"
nix = { version = "=0.31.3", features = ["user", "fs"] }
insta = { version = "=1.48.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
